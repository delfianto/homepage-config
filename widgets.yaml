---
# For configuration options and examples, please see:
# https://gethomepage.dev/configs/info-widgets/

- resources:
    label: System
    cpu: true
    memory: true
    uptime: true

- resources:
    label: Storage
    disk: /

- resources:
    label: Network
    network: true

- search:
    provider: google
    target: _blank

- datetime:
    format:
      dateStyle: long
      timeStyle: short
      hour12: false

- openmeteo:
    # Location comes from env (HOMEPAGE_VAR_WEATHER_*), set outside this repo
    label: "{{HOMEPAGE_VAR_WEATHER_LABEL}}"
    latitude: "{{HOMEPAGE_VAR_WEATHER_LAT}}"
    longitude: "{{HOMEPAGE_VAR_WEATHER_LON}}"
    timezone: "{{HOMEPAGE_VAR_WEATHER_TZ}}"
    units: metric
    cache: 5
